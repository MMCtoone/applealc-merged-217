name: Build merged AppleALC

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT
  ACID32: 1
  JOB_TYPE: BUILD

jobs:
  inplace:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout AppleALC 1.9.6
        uses: actions/checkout@v4
        with:
          repository: acidanthera/AppleALC
          ref: 1.9.6
          path: alc

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: alc/MacKernelSDK

      - name: Apply in-place variants
        run: python3 make_inplace.py

      - name: CI Bootstrap
        working-directory: alc
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Lilu Bootstrap
        working-directory: alc
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Scripts/bootstrap.sh) && eval "$src" || exit 1

      - name: Build
        working-directory: alc
        run: xcodebuild -jobs 1 -configuration Release -arch ACID32 -arch x86_64

      - name: Show products
        if: always()
        working-directory: alc
        run: |
          ls -l build/*/*.zip 2>/dev/null || echo "no product"

      - name: Publish release asset
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-inplace
          name: in-place fixes on AppleALC 1.9.6 (run ${{ github.run_number }})
          body: |
            layout21 with layout28's IntSpeaker block, and layout28 with layout21's pin config.
          files: alc/build/*/*.zip
